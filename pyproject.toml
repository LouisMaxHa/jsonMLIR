[project]
name = "jsonmlir"
description = "A template project using MLIR interface."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic~=2.13.0", "pyyaml~=6.0", "rich>=13.9.0"]

classifiers = ["Programming Language :: Python :: 3 :: Only", "Typing :: Typed"]
license = { text = "Apache License v2.0 with LLVM Exceptions" }
authors = []
dynamic = ["version"]

[project.scripts]
jsonmlir = "jsonmlir.pipeline.compiler:main"

[project.urls]
Homepage = "https://github.com/Louis-max-H/jsonMLIR"
"Source Code" = "https://github.com/Louis-max-H/jsonMLIR"
"Issue Tracker" = "https://github.com/Louis-max-H/jsonMLIR/issues"


[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/jsonmlir"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov",
    "pyright==1.1.410",
    "psutil",
]


[tool.pyright]
venvPath = "."
venv = ".venv"
enableExperimentalFeatures = true
reportAssertAlwaysTrue = true
reportUnnecessaryCast = true
reportUnnecessaryIsInstance = true
reportUnnecessaryTypeIgnoreComment = true
typeCheckingMode = "strict"
# Les bindings Python de MLIR (mlir_core) ne fournissent pas de py.typed.
reportMissingTypeStubs = false
extraPaths = ["src", "tests"]
"include" = ["docs", "src", "tests"]

[tool.ruff]
# Support Python 3.10+.
target-version = "py310"
src = ["src/", "tests/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "PT", "TID251", "INP", "PYI"]
ignore = [
    "E741",   # https://beta.ruff.rs/docs/rules/ambiguous-variable-name/
    "PT006",  # https://beta.ruff.rs/docs/rules/pytest-parametrize-names-wrong-type/
    "PT011",  # https://beta.ruff.rs/docs/rules/pytest-raises-too-broad/
    "PT012",  # https://beta.ruff.rs/docs/rules/pytest-raises-with-multiple-statements/
    "PYI041", # https://docs.astral.sh/ruff/rules/redundant-numeric-union
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
addopts = ["--durations=20", "--maxfail=5", "--import-mode=importlib"]

[tool.coverage.run]
relative_files = true
branch = true
source = ["src/"]
concurrency = ["multiprocessing"]
parallel = true

[tool.coverage.report]
exclude_lines = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    # Don't complain if tests don't hit defensive assertion code:
    "raise NotImplementedError",
    "raise ValueError",
    "raise TypeError",
    "raise RuntimeError",
    "assert_never",
    'if TYPE_CHECKING:',
    'pragma: no cover',
]
format = "markdown"
